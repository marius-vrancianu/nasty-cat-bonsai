# Manual deploy to GitHub Pages.
#
# Nothing is published automatically: pushing commits does NOT deploy.
# To publish the current state of `main`, go to the repo's Actions tab,
# pick "Deploy to GitHub Pages", and press "Run workflow".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The gallery's thumbnails are cut during the build from the photos in
      # bonsai-images (see galleryThumb in eleventy.config.js), and every
      # source it downloads is kept in .cache/. Carrying that between runs
      # means a build only fetches photos added since the last one; without
      # it every run re-downloads the whole gallery, which is already tens of
      # megabytes and is meant to grow. The key is this run and the
      # restore-key is the bare prefix — the rolling-cache pattern: each run
      # restores the newest cache that exists and saves a fresh one, so the
      # cache follows the gallery rather than pinning to one state of it.
      - name: Keep the downloaded photos between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: gallery-sources-${{ github.run_id }}
          restore-keys: gallery-sources-

      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Auto-enables Pages (source: GitHub Actions) on first run.
          # If this step fails with a permissions error, enable it once by
          # hand: Settings → Pages → Source → "GitHub Actions".
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
