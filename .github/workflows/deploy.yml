# Manual deploy to GitHub Pages.
#
# Nothing is published automatically: pushing commits does NOT deploy.
# To publish the current state of `main`, go to the repo's Actions tab,
# pick "Deploy to GitHub Pages", and press "Run workflow".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The site's thumbnails are cut during the build from the photos in
      # bonsai-images (see cdnImg in eleventy.config.js). Two directories
      # have to survive between runs, and they are not the same saving:
      #
      #   .cache                 the DOWNLOADED sources. Without it every run
      #                          re-fetches the whole gallery, already tens
      #                          of megabytes and meant to grow.
      #   _site/assets/photos    the ENCODED copies. Without it every run
      #                          re-encodes all of them from those sources —
      #                          measured at 0.13s per photo, so about 40
      #                          seconds a deploy once the gallery is in the
      #                          hundreds. This is what "a photo it has
      #                          already seen costs nothing" (GUIDE 1.5)
      #                          always claimed and did not do.
      #
      # eleventy-img names each output after a hash of the bytes that made
      # it, so restoring the directory is enough: a build skips any file
      # already sitting there and works only on photos it has not seen.
      #
      # The key is this run and the restore-key is the bare prefix — the
      # rolling-cache pattern: each run restores the newest cache that
      # exists and saves a fresh one, so the cache follows the gallery
      # rather than pinning to one state of it. A consequence worth knowing:
      # a photo dropped from gallery.json leaves its encoded copies behind
      # for good, since nothing here prunes. They are unreferenced and cost
      # only artifact size. Deleting the cache in the Actions tab is the
      # reset button, at the price of one slow build.
      - name: Keep the downloaded and encoded photos between runs
        uses: actions/cache@v4
        with:
          path: |
            .cache
            _site/assets/photos
          key: gallery-sources-${{ github.run_id }}
          restore-keys: gallery-sources-

      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Auto-enables Pages (source: GitHub Actions) on first run.
          # If this step fails with a permissions error, enable it once by
          # hand: Settings → Pages → Source → "GitHub Actions".
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
