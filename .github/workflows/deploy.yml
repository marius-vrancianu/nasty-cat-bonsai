# Manual deploy to GitHub Pages.
#
# Nothing is published automatically: pushing commits does NOT deploy.
# To publish the current state of `main`, go to the repo's Actions tab,
# pick "Deploy to GitHub Pages", and press "Run workflow".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The photos and gallery.json from the images repo: one clone of its latest
      # commit (no per-photo downloads from raw.githubusercontent.com, which
      # rate-limits and caches). Public repo, so the default token is enough. See
      # "Where the photos come from" in eleventy.config.js.
      - name: Check out the photos
        uses: actions/checkout@v7
        with:
          repository: marius-vrancianu/bonsai-images
          path: .images

      # The copies the build cuts (see cdnImg in eleventy.config.js). Encoding is
      # the slow part, so this survives between runs; copies are named after a hash
      # of their source, so a build only encodes new photos. Rolling cache: each
      # run restores the newest and saves a fresh one. The build prunes copies no
      # page uses, so the cache is always the current gallery. GitHub drops caches
      # unused for a week (next run re-encodes everything once); deleting the cache
      # in the Actions tab is the reset button.
      - name: Keep the cut copies of the photos between runs
        uses: actions/cache@v6
        with:
          path: _site/assets/photos
          key: photo-copies-${{ github.run_id }}
          restore-keys: photo-copies-

      - run: npm run build
        env:
          IMAGES_DIR: .images
      - uses: actions/configure-pages@v6
        with:
          # Auto-enables Pages (source: GitHub Actions) on first run.
          # If this step fails with a permissions error, enable it once by
          # hand: Settings → Pages → Source → "GitHub Actions".
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
