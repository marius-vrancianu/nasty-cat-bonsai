# Checks the home page's hill backdrop. This workflow NEVER publishes
# anything — deploying is still the manual "Deploy to GitHub Pages" button,
# and a red run here cannot stop you pressing it. It is here to catch the one
# class of mistake the code cannot catch itself: the backdrop is placed
# against things the browser measures at runtime (the foot of a link, the top
# of the footer row), and a handful of figures in main.css are hand-measured
# copies of those. When one drifts, nothing about CSS says so.
name: Check the hills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cheap and browserless: have the drawings and the figures in main.css
      # drifted from tools/gen-hills.py? This is the whole of the first class
      # of mistake, and it costs a second.
      - name: The drawings match their generator
        run: python3 tools/gen-hills.py --check

      # The gallery's thumbnails are cut during the build from the photos in
      # bonsai-images (see galleryThumb in eleventy.config.js), and every
      # source it downloads is kept in .cache/. Carrying that between runs
      # means a build only fetches photos added since the last one; without
      # it every run re-downloads the whole gallery, which is already tens of
      # megabytes and is meant to grow. The key is this run and the
      # restore-key is the bare prefix — the rolling-cache pattern: each run
      # restores the newest cache that exists and saves a fresh one, so the
      # cache follows the gallery rather than pinning to one state of it.
      - name: Keep the downloaded photos between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: gallery-sources-${{ github.run_id }}
          restore-keys: gallery-sources-

      - run: npm run build

      # Playwright is deliberately not a dependency of the site — see the top
      # of tools/check-hills.mjs — so it is installed just for this job.
      - name: Install a browser
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: The backdrop keeps its rules
        run: node tools/check-hills.mjs
