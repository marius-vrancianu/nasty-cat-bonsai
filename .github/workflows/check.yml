# Checks the home page's hill backdrop. This workflow NEVER publishes
# anything — deploying is still the manual "Deploy to GitHub Pages" button,
# and a red run here cannot stop you pressing it. It is here to catch the one
# class of mistake the code cannot catch itself: the backdrop is placed
# against things the browser measures at runtime (the foot of a link, the top
# of the footer row), and a handful of figures in main.css are hand-measured
# copies of those. When one drifts, nothing about CSS says so.
name: Check the hills

# Only when something that can move the backdrop changed. A post, a page's
# text or the docs cannot, and each run installs a whole browser — minutes
# of the Actions tab, and a red mark that is easy to mistake for a failed
# deploy. The hills live on the home page only, but the build is the
# deploy's own build, so templates, styles, scripts and config all count.
on:
  push:
    paths-ignore:
      - "**.md"
      - "src/posts/**"
      - "comments-worker/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "src/posts/**"
      - "comments-worker/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cheap and browserless: have the drawings and the figures in main.css
      # drifted from tools/gen-hills.py? This is the whole of the first class
      # of mistake, and it costs a second.
      - name: The drawings match their generator
        run: python3 tools/gen-hills.py --check

      # The photos themselves, and gallery.json, straight from the images
      # repo: one git clone of its latest commit, rather than one download
      # per photo from raw.githubusercontent.com. That host limits anonymous
      # downloads and serves through a cache of its own; a clone is neither.
      # See "Where the photos come from" in eleventy.config.js. Public repo,
      # so the workflow's own token is enough.
      - name: Check out the photos
        uses: actions/checkout@v7
        with:
          repository: marius-vrancianu/bonsai-images
          path: .images

      # The copies the build cuts from those photos (see cdnImg in
      # eleventy.config.js). Encoding is the slow part — measured at 0.13s
      # per photo — so this directory survives between runs: eleventy-img
      # names each copy after a hash of the photo that made it, and skips
      # any it finds already here. A new photo costs one encoding; one it
      # has seen costs nothing.
      #
      # The key is this run and the restore-key is the bare prefix — the
      # rolling-cache pattern: each run restores the newest cache that
      # exists and saves a fresh one, so the cache follows the gallery
      # rather than pinning to one state of it. The build deletes the copies
      # of photos no page shows any more, so what is saved is always exactly
      # the current gallery. GitHub drops a cache nobody has used for a
      # week; the next run then encodes everything once, which is slow but
      # harmless. Deleting the cache in the Actions tab is the reset button,
      # at the same price.
      - name: Keep the cut copies of the photos between runs
        uses: actions/cache@v6
        with:
          path: _site/assets/photos
          key: photo-copies-${{ github.run_id }}
          restore-keys: photo-copies-

      - run: npm run build
        env:
          IMAGES_DIR: .images

      # Playwright is deliberately not a dependency of the site — see the top
      # of tools/check-hills.mjs — so it is installed just for this job.
      - name: Install a browser
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: The backdrop keeps its rules
        run: node tools/check-hills.mjs
