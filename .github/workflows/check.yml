# Checks the home page's hill backdrop. NEVER publishes anything, and a red
# run here does not block the manual deploy. It catches what CSS cannot: a
# few figures in main.css are hand-measured copies of things the browser
# lays out at runtime (a link's foot, the footer row's top), and drift
# silently.
name: Check the hills

# Skip changes that cannot move the backdrop (posts, page text, docs, the
# worker); each run installs a browser. It builds the whole site, so
# templates, styles, scripts and config all count.
on:
  push:
    paths-ignore:
      - "**.md"
      - "src/posts/**"
      - "comments-worker/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "src/posts/**"
      - "comments-worker/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cheap and browserless: do the SVGs and main.css's generated figures
      # still match tools/gen-hills.py?
      - name: The drawings match their generator
        run: python3 tools/gen-hills.py --check

      # The photos and gallery.json from the images repo: one clone of its latest
      # commit (no per-photo downloads from raw.githubusercontent.com, which
      # rate-limits and caches). Public repo, so the default token is enough. See
      # "Where the photos come from" in eleventy.config.js.
      - name: Check out the photos
        uses: actions/checkout@v7
        with:
          repository: marius-vrancianu/bonsai-images
          path: .images

      # The copies the build cuts (see cdnImg in eleventy.config.js). Encoding is
      # the slow part, so this survives between runs; copies are named after a hash
      # of their source, so a build only encodes new photos. Rolling cache: each
      # run restores the newest and saves a fresh one. The build prunes copies no
      # page uses, so the cache is always the current gallery. GitHub drops caches
      # unused for a week (next run re-encodes everything once); deleting the cache
      # in the Actions tab is the reset button.
      - name: Keep the cut copies of the photos between runs
        uses: actions/cache@v6
        with:
          path: _site/assets/photos
          key: photo-copies-${{ github.run_id }}
          restore-keys: photo-copies-

      - run: npm run build
        env:
          IMAGES_DIR: .images

      # Playwright is not a site dependency (see tools/check-hills.mjs), so it is
      # installed just for this job.
      - name: Install a browser
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: The backdrop keeps its rules
        run: node tools/check-hills.mjs
